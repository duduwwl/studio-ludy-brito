<section class="contact" id="contato" aria-labelledby="contato-title">
  <h2 id="contato-title" class="contact-title" data-reveal>Onde estamos</h2>
  <div class="contact-row">
    <p class="contact-statement" data-reveal>Rua Bernardino Macieira, 334, no Centro de Lavras. Passe para um café.</p>
    <figure class="contact-mark" data-reveal>
      <img src="{{root}}images/brand/logo-lb-150.webp" width="150" height="150" loading="lazy" alt="Monograma LB do Studio Ludy Brito">
    </figure>
    <div class="contact-links" data-reveal>
      <p class="contact-question">Quer marcar ou tirar uma dúvida?</p>
      <p><a class="link-plain" href="{{biz.whatsappUrl}}" rel="noopener" data-wa>WhatsApp {{biz.whatsappDisplay}}</a></p>
      <p><a class="link-plain" href="{{biz.directionsUrl}}" rel="noopener">Como chegar</a></p>
      <p><a class="link-plain" href="{{biz.instagramUrl}}" rel="noopener">Instagram @{{biz.instagram}}</a></p>
      <p class="contact-meta">Terça a sexta, 8h às 19h · Sábado, 9h às 13h<br>Domingo e segunda, fechado</p>
    </div>
  </div>
  <div class="map" data-reveal>
    <iframe title="Mapa: Studio Ludy Brito, Rua Bernardino Macieira, 334, Lavras" src="{{biz.mapEmbed}}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </div>
</section>
