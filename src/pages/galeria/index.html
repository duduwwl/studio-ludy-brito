<!--meta {"title": "Galeria de trabalhos · Studio Ludy Brito", "description": "Unhas feitas no Studio Ludy Brito, em Lavras: esmaltação em gel, alongamento, francesinha e cuidados com os pés.", "nav": "galeria", "bodyClass": "page-galeria", "scripts": ["gallery"]} -->
<header class="page-head">
  <h1 data-rise>Galeria</h1>
  <p data-rise style="--i:1">Trabalhos feitos no studio e publicados no nosso Instagram. Toque em uma foto para ampliar.</p>
</header>
<section class="gallery-page" aria-label="Trabalhos do studio">
  <div class="chips" role="group" aria-label="Filtrar trabalhos" data-gallery-filters>
    <button class="chip" type="button" aria-pressed="true" data-filter="">Todos</button>
    <button class="chip" type="button" aria-pressed="false" data-filter="maos">Mãos</button>
    <button class="chip" type="button" aria-pressed="false" data-filter="alongamento">Alongamento</button>
    <button class="chip" type="button" aria-pressed="false" data-filter="pes">Pés</button>
  </div>
  <p class="sr-only" aria-live="polite" data-gallery-count></p>
  <div class="gallery-grid" data-gallery>
    <figure class="gallery-item" data-cat="maos" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/azul-glitter-retrato-1800.webp" aria-label="Ampliar: esmaltação em gel azul com glitter">
        <span class="gallery-frame">[[img src="gallery/azul-glitter-retrato" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Cliente mostrando as unhas em esmaltação azul com glitter"]]</span>
      </button>
      <figcaption>Esmaltação em gel azul com glitter.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="alongamento" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/preto-francesinha-dourada-1800.webp" aria-label="Ampliar: alongamento preto com francesinha dourada">
        <span class="gallery-frame">[[img src="gallery/preto-francesinha-dourada" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Unhas alongadas em preto com francesinha dourada"]]</span>
      </button>
      <figcaption>Alongamento em preto com francesinha dourada.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="pes" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/pes-gel-francesinha-1800.webp" aria-label="Ampliar: esmaltação em gel nos pés">
        <span class="gallery-frame">[[img src="gallery/pes-gel-francesinha" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Pés com francesinha em gel e calça jeans"]]</span>
      </button>
      <figcaption>A paz de uma esmaltação em gel nos pés.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="maos" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/marsala-1800.webp" aria-label="Ampliar: unhas em marsala">
        <span class="gallery-frame">[[img src="gallery/marsala" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Cliente com unhas em marsala segurando um tablet"]]</span>
      </button>
      <figcaption>Marsala: elegante, marcante e cheia de presença.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="alongamento" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/alongamento-nude-pontos-1200.webp" aria-label="Ampliar: alongamento nude com pontos de brilho">
        <span class="gallery-frame">[[img src="gallery/alongamento-nude-pontos" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Unhas alongadas nude com pontos de brilho"]]</span>
      </button>
      <figcaption>Alongamento e esmaltação em gel.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="maos" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/azul-glitter-maos-1800.webp" aria-label="Ampliar: mãos com esmaltação azul">
        <span class="gallery-frame">[[img src="gallery/azul-glitter-maos" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="As duas mãos com esmaltação azul com glitter"]]</span>
      </button>
      <figcaption>O mesmo azul, de frente.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="pes" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/pes-branco-1200.webp" aria-label="Ampliar: pés com esmaltação branca">
        <span class="gallery-frame">[[img src="gallery/pes-branco" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Pés com unhas brancas e chinelo azul-marinho"]]</span>
      </button>
      <figcaption>Pés em branco. Publicado em parceria com @isabella_carvalhonails.</figcaption>
    </figure>
    <figure class="gallery-item" data-cat="maos" data-reveal>
      <button type="button" data-full="{{root}}images/gallery/azul-glitter-detalhe-1800.webp" aria-label="Ampliar: detalhe da esmaltação azul">
        <span class="gallery-frame">[[img src="gallery/azul-glitter-detalhe" sizes="(min-width: 64em) 30vw, (min-width: 40em) 45vw, 100vw" alt="Detalhe da esmaltação azul com glitter e anéis prateados"]]</span>
      </button>
      <figcaption>Detalhe, com os anéis de sempre.</figcaption>
    </figure>
  </div>
  <p class="wall-more"><a class="link-arrow" href="{{biz.instagramUrl}}" rel="noopener">Mais trabalhos no Instagram @{{biz.instagram}}</a></p>
</section>

<dialog class="lightbox" aria-label="Foto ampliada" data-lightbox>
  <div class="lightbox-inner">
    <div class="lightbox-top"><span data-lightbox-count></span><button type="button" data-lightbox-close>Fechar</button></div>
    <div class="lightbox-stage"><img alt="" data-lightbox-img></div>
    <div class="lightbox-bottom">
      <button type="button" data-lightbox-prev>Anterior</button>
      <p class="lightbox-caption" data-lightbox-caption></p>
      <button type="button" data-lightbox-next>Próxima</button>
    </div>
  </div>
</dialog>
